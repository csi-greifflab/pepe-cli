name: Publish Test Branch to TestPyPI (Trusted Publishing)

on:
  push:
    branches: [ test ]
  workflow_dispatch:  # Allows manual triggering

jobs:
  build-and-publish-test:
    runs-on: ubuntu-latest
    environment: testpypi  # GitHub environment for publishing
    permissions:
      id-token: write  # Required for trusted publishing
      contents: read
    outputs:
      test_version: ${{ steps.version_step.outputs.test_version }}
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install build dependencies
      run: |
        python3 -m pip install --upgrade pip
        pip install build
    
    - name: Update version for test branch
      id: version_step
      run: |
        # Get current timestamp for unique version
        TIMESTAMP=$(date +%Y%m%d%H%M%S)
        # Extract metadata directly from __init__.py (avoids importing package deps like torch)
        CURRENT_VERSION=$(grep -m1 '__version__ = ' src/pepe/__init__.py | sed 's/__version__ = "\(.*\)"/\1/')
        PACKAGE_NAME=$(grep -m1 '__package_name__ = ' src/pepe/__init__.py | sed 's/__package_name__ = "\(.*\)"/\1/')
        MODULE_NAME=$(grep -m1 '__module_name__ = ' src/pepe/__init__.py | sed 's/__module_name__ = "\(.*\)"/\1/')
        # Create a unique TestPyPI version by stripping any existing dev suffix,
        # then appending .dev{timestamp} (TestPyPI rejects re-uploading the same version).
        BASE_VERSION=$(echo "$CURRENT_VERSION" | sed -E 's/(-dev|\.dev[0-9]*)$//')
        TEST_VERSION="${BASE_VERSION}.dev${TIMESTAMP}"
        
        # Output version for other jobs
        echo "test_version=$TEST_VERSION" >> $GITHUB_OUTPUT
        
        # Update version in __init__.py
        sed -i "s/__version__ = \"$CURRENT_VERSION\"/__version__ = \"$TEST_VERSION\"/" src/pepe/__init__.py
        echo "Updated version from $CURRENT_VERSION to $TEST_VERSION"
        echo "Package name: $PACKAGE_NAME"
        echo "Module name: $MODULE_NAME"
        grep "__version__" src/pepe/__init__.py
    
    - name: Build package
      run: python3 -m build
    
    - name: Publish to TestPyPI (Trusted Publishing)
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        repository-url: https://test.pypi.org/legacy/
        verbose: true
    
    - name: Output installation command
      run: |
        PACKAGE_NAME=$(grep -m1 '__package_name__ = ' src/pepe/__init__.py | sed 's/__package_name__ = "\(.*\)"/\1/')
        echo "Package published to TestPyPI!"
        echo "To install the test version, run:"
        echo "pip install --index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple \"$PACKAGE_NAME\""
    
    - name: Wait for package availability
      run: |
        echo "Waiting for package to be available on TestPyPI..."
        sleep 30
    
    - name: Test installation and functionality
      run: |
        PACKAGE_NAME=$(grep -m1 '__package_name__ = ' src/pepe/__init__.py | sed 's/__package_name__ = "\(.*\)"/\1/')
        MODULE_NAME=$(grep -m1 '__module_name__ = ' src/pepe/__init__.py | sed 's/__module_name__ = "\(.*\)"/\1/')
        
        # Create a fresh virtual environment for testing
        python3 -m venv test_env
        source test_env/bin/activate
        
        # Install the package from TestPyPI
        pip install --index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple "$PACKAGE_NAME"
        
        # Verify installation
        pip list | grep -i pepe
        
        # Test basic import
        python3 -c "import $MODULE_NAME; print('Package imported successfully')"

        # Run unit tests that don't require model downloads
        echo "Running unit tests..."
        pip install pytest
        python3 -m pytest src/tests/test_device_logic.py src/tests/test_parse_arguments.py -v

        # Clean up
        deactivate
        rm -rf test_env

        echo "✅ Package verification completed successfully!"

  publish-conda-test:
    runs-on: ubuntu-latest
    needs: build-and-publish-test
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: '3.10'
          channels: pytorch,defaults,conda-forge,bioconda

      - name: Install build tools
        shell: bash -l {0}
        run: |
          conda install -y conda-build anaconda-client

      - name: Build Conda Package
        shell: bash -l {0}
        env:
          GIT_DESCRIBE_TAG: ${{ needs.build-and-publish-test.outputs.test_version }}
        run: |
          # Sync __init__.py version to match the conda recipe version
          CURRENT_VERSION=$(grep -m1 '__version__ = ' src/pepe/__init__.py | sed 's/__version__ = "\(.*\)"/\1/')
          sed -i "s/__version__ = \"$CURRENT_VERSION\"/__version__ = \"$GIT_DESCRIBE_TAG\"/" src/pepe/__init__.py
          echo "Updated version to $GIT_DESCRIBE_TAG for conda build"
          conda-build .github/conda --output-folder dist/conda --channel pytorch --channel conda-forge --channel defaults

      - name: Upload to Anaconda (Test Label)
        shell: bash -l {0}
        env:
          ANACONDA_TOKEN: ${{ secrets.ANACONDA_TOKEN }}
        run: |
          PACKAGE_PATH=$(find dist/conda -name "*.tar.bz2" -o -name "*.conda" | head -n 1)
          if [ -z "$PACKAGE_PATH" ]; then
            echo "Error: No package found!"
            exit 1
          fi
          echo "Found package: $PACKAGE_PATH"
          anaconda -t $ANACONDA_TOKEN upload --label test $PACKAGE_PATH
